name: Build cfnat C (All Platforms & Architectures)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      edition:
        description: '编译版本（cfd=默认全功能版 0.3.0 含 -cfd；pure=纯 cfnat 版 0.2.x，剔除 -cfd）'
        type: choice
        options:
          - cfd
          - pure
        default: cfd
      targets:
        description: '构建目标（逗号/空格分隔，all=全量；分组: linux/linux-static/musl/windows/macos/android/freebsd；或具体名如 windows-amd64,linux-mipsel-musl）'
        required: false
        default: 'all'
      tag_name:
        description: 'Release 标签版本（例如 v0.2.0，留空则自动从 cfnat.c 提取版本）'
        required: false
        default: ''
      prerelease:
        description: '是否标记为 Pre-release 预发布'
        type: boolean
        default: false
      publish_release:
        description: '是否发布 GitHub Release（取消勾选则仅上传 Workflow Artifacts 供测试下载）'
        type: boolean
        default: true

permissions:
  contents: write

env:
  SOURCE_FILE: cfnat.c
  ZIG_VERSION: 0.15.1
  FREEBSD_VER: 14.5-RELEASE
  UPX_VERSION: 5.3.0

jobs:
  build-all:
    name: "Build All Platforms (Ubuntu Pool)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          token: ${{ github.token }}

      - name: Cache Android NDK
        id: cache-ndk
        if: >-
          github.event_name != 'workflow_dispatch' ||
          inputs.targets == '' ||
          contains(inputs.targets, 'all') ||
          contains(inputs.targets, 'android')
        uses: actions/cache@v4
        with:
          path: /tmp/android-ndk-r27c
          key: ndk-${{ runner.os }}-${{ runner.arch }}-r27c-v1

      - name: Setup Android NDK (on cache miss)
        if: >-
          (github.event_name != 'workflow_dispatch' ||
          inputs.targets == '' ||
          contains(inputs.targets, 'all') ||
          contains(inputs.targets, 'android')) &&
          steps.cache-ndk.outputs.cache-hit != 'true'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Populate or activate cached Android NDK
        if: >-
          github.event_name != 'workflow_dispatch' ||
          inputs.targets == '' ||
          contains(inputs.targets, 'all') ||
          contains(inputs.targets, 'android')
        shell: bash
        run: |
          set -euo pipefail
          if [ -d /tmp/android-ndk-r27c/toolchains/llvm/prebuilt ]; then
            echo "✅ Using cached Android NDK: /tmp/android-ndk-r27c"
            echo "ANDROID_NDK_ROOT=/tmp/android-ndk-r27c" >> "$GITHUB_ENV"
          else
            echo "📦 Caching Android NDK llvm toolchain to /tmp/android-ndk-r27c ..."
            mkdir -p /tmp/android-ndk-r27c/toolchains/llvm
            cp -a "${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt" /tmp/android-ndk-r27c/toolchains/llvm/
            echo "ANDROID_NDK_ROOT=/tmp/android-ndk-r27c" >> "$GITHUB_ENV"
          fi

      - name: Cache Zig & UPX toolchains
        id: cache-zig
        uses: actions/cache@v4
        with:
          path: |
            /tmp/zig-toolchain
            /tmp/upx-toolchain
          key: zig-upx-${{ runner.os }}-${{ runner.arch }}-${{ env.ZIG_VERSION }}-${{ env.UPX_VERSION }}

      - name: Cache FreeBSD sysroots
        id: cache-freebsd
        if: >-
          github.event_name != 'workflow_dispatch' ||
          inputs.targets == '' ||
          contains(inputs.targets, 'all') ||
          contains(inputs.targets, 'freebsd')
        uses: actions/cache@v4
        with:
          path: /tmp/freebsd-sysroot
          key: freebsd-sysroot-${{ env.FREEBSD_VER }}-v1

      - name: Setup Zig, UPX & FreeBSD Sysroots
        shell: bash
        env:
          TARGETS_RAW: ${{ github.event_name == 'workflow_dispatch' && inputs.targets || 'all' }}
          EDITION: ${{ github.event_name == 'workflow_dispatch' && inputs.edition || 'cfd' }}
        run: |
          set -euo pipefail
          TARGETS=" $(echo "${TARGETS_RAW:-all}" | tr '[:upper:],' '[:lower:] ') "

          case "$(uname -m)" in
            x86_64)        zig_arch="x86_64";  upx_arch="amd64" ;;
            aarch64|arm64) zig_arch="aarch64"; upx_arch="arm64" ;;
            *) echo "Unsupported runner arch: $(uname -m)" >&2; exit 1 ;;
          esac

          CURL_SAFE=(curl -fsSL --connect-timeout 15 --max-time 120 --speed-limit 20480 --speed-time 15 --retry 2 --retry-delay 2)

          zig_dir="zig-${zig_arch}-linux-${ZIG_VERSION}"
          if [ -x "/tmp/zig-toolchain/${zig_dir}/zig" ]; then
            echo "✅ Using cached Zig: /tmp/zig-toolchain/${zig_dir}"
          else
            mkdir -p /tmp/zig-toolchain
            echo "🔍 Benchmarking Zig community mirrors for ${zig_dir}.tar.xz ..."
            mirror_list=()
            if mirrors_raw=$(curl -fsSL --connect-timeout 5 --max-time 10 https://ziglang.org/download/community-mirrors.txt 2>/dev/null); then
              : > /tmp/zig-mirrors.txt
              while IFS= read -r m; do
                m="${m%%#*}"
                m="$(echo "$m" | tr -d '[:space:]')"
                [ -z "$m" ] && continue
                m="${m%/}"
                (
                  res=$(curl -o /dev/null -s -L -I -w "%{http_code} %{time_total}" --connect-timeout 3 --max-time 5 "${m}/${zig_dir}.tar.xz" || echo "000 99.0")
                  code="${res%% *}"
                  t="${res#* }"
                  if [ "$code" = "200" ]; then
                    printf "%s %s\n" "$t" "$m" >> /tmp/zig-mirrors.txt
                  fi
                ) &
              done <<< "$mirrors_raw"
              wait || true
              if [ -s /tmp/zig-mirrors.txt ]; then
                echo "Fastest reachable Zig mirrors:"
                sort -k1 -n /tmp/zig-mirrors.txt | tee /tmp/zig-mirrors-sorted.txt
                while IFS=' ' read -r _ murl; do
                  mirror_list+=("$murl")
                done < /tmp/zig-mirrors-sorted.txt
              fi
              rm -f /tmp/zig-mirrors.txt /tmp/zig-mirrors-sorted.txt
            fi
            mirror_list+=("https://ziglang.org/download/${ZIG_VERSION}")

            echo "⬇️ Downloading ${zig_dir}.tar.xz ..."
            zig_ok=0
            for base_url in "${mirror_list[@]}"; do
              if "${CURL_SAFE[@]}" "${base_url}/${zig_dir}.tar.xz" -o /tmp/zig.tar.xz; then
                zig_ok=1
                echo "✅ Downloaded Zig from ${base_url}"
                break
              fi
              echo "⚠️ Mirror ${base_url} failed or timed out, trying next..."
            done
            if [ "$zig_ok" -ne 1 ]; then
              echo "❌ All Zig download mirrors failed" >&2
              exit 1
            fi
            tar -xf /tmp/zig.tar.xz -C /tmp/zig-toolchain
            rm -f /tmp/zig.tar.xz
          fi
          echo "/tmp/zig-toolchain/${zig_dir}" >> "$GITHUB_PATH"

          if [[ "$TARGETS" == *" all "* || "$TARGETS" == *" linux "* || "$TARGETS" == *" linux-static "* || "$TARGETS" == *" musl "* || "$TARGETS" == *" linux-musl "* || "$TARGETS" == *"mips"* ]]; then
            upx_dir="upx-${UPX_VERSION}-${upx_arch}_linux"
            if [ -x "/tmp/upx-toolchain/${upx_dir}/upx" ]; then
              echo "✅ Using cached UPX: /tmp/upx-toolchain/${upx_dir}"
            else
              mkdir -p /tmp/upx-toolchain
              echo "⬇️ Downloading ${upx_dir}.tar.xz ..."
              "${CURL_SAFE[@]}" "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/${upx_dir}.tar.xz" -o /tmp/upx.tar.xz
              tar -xf /tmp/upx.tar.xz -C /tmp/upx-toolchain
              rm -f /tmp/upx.tar.xz
            fi
            echo "/tmp/upx-toolchain/${upx_dir}" >> "$GITHUB_PATH"
          fi

          # 仅在需要编译 FreeBSD 且缓存未命中时下载对应 sysroot
          if [[ "$TARGETS" == *" all "* || "$TARGETS" == *" freebsd "* || "$TARGETS" == *"freebsd-"* ]]; then
            for arch in amd64 arm64; do
              if [[ "$TARGETS" != *" all "* && "$TARGETS" != *" freebsd "* && "$TARGETS" != *" freebsd-${arch} "* ]]; then
                continue
              fi
              if [ -d "/tmp/freebsd-sysroot/${arch}/usr/include" ] && [ -d "/tmp/freebsd-sysroot/${arch}/usr/lib" ]; then
                echo "✅ Using cached FreeBSD ${FREEBSD_VER} sysroot (${arch})"
                continue
              fi
              echo "⬇️ Downloading FreeBSD ${FREEBSD_VER} sysroot (${arch}) ..."
              mkdir -p "/tmp/freebsd-sysroot/${arch}"
              if [ "$arch" = "arm64" ]; then
                fbsd_url="https://download.freebsd.org/releases/arm64/aarch64/${FREEBSD_VER}/base.txz"
              else
                fbsd_url="https://download.freebsd.org/releases/amd64/${FREEBSD_VER}/base.txz"
              fi
              "${CURL_SAFE[@]}" "$fbsd_url" -o "/tmp/fbsd-${arch}.txz"
              tar -xJf "/tmp/fbsd-${arch}.txz" -C "/tmp/freebsd-sysroot/${arch}" ./usr/include ./usr/lib ./lib
              rm -f "/tmp/fbsd-${arch}.txz"
            done
          fi

      - name: Build selected Ubuntu pool targets concurrently
        shell: bash
        env:
          TARGETS_RAW: ${{ github.event_name == 'workflow_dispatch' && inputs.targets || 'all' }}
          EDITION: ${{ github.event_name == 'workflow_dispatch' && inputs.edition || 'cfd' }}
        run: |
          set -euo pipefail
          zig version
          if command -v upx >/dev/null 2>&1; then
            upx --version | head -n 1
          fi
          mkdir -p release /tmp/build-logs /tmp/zig-cache/global

          TARGETS=" $(echo "${TARGETS_RAW:-all}" | tr '[:upper:],' '[:lower:] ') "
          echo "Selected targets filter:${TARGETS}"

          want() {
            local key
            for key in "$@"; do
              if [[ "$TARGETS" == *" ${key} "* ]]; then
                return 0
              fi
            done
            return 1
          }

          COMMON_SIZE_FLAGS=(
            -Os -flto -pipe -std=c23
            -ffunction-sections -fdata-sections
            -fno-unwind-tables -fno-asynchronous-unwind-tables
            -Wall -Wextra -Wno-unused-parameter
          )
          if [ "${EDITION:-cfd}" = "pure" ]; then
            echo "Building pure cfnat edition (-DCFNAT_ENABLE_CFD=0)"
            COMMON_SIZE_FLAGS+=(-DCFNAT_ENABLE_CFD=0)
          else
            echo "Building cfd full edition (CFNAT_ENABLE_CFD=1)"
          fi

          names=()
          pids=()

          launch() {
            local name="$1"
            shift
            while [ "$(jobs -rp | wc -l)" -ge 4 ]; do sleep 0.2; done
            names+=("$name")
            (
              set -euo pipefail
              "$@"
            ) >"/tmp/build-logs/${name}.log" 2>&1 &
            pids+=("$!")
          }

          build_zig_linux_static() {
            local name="$1" target="$2" out="$3"
            shift 3
            ZIG_LOCAL_CACHE_DIR="/tmp/zig-cache/${name}/local" \
            ZIG_GLOBAL_CACHE_DIR="/tmp/zig-cache/global" \
            zig cc -target "$target" "${COMMON_SIZE_FLAGS[@]}" "$@" \
              "$SOURCE_FILE" -o "release/${out}" \
              -Wl,--gc-sections -pthread -static -s
          }

          build_zig_linux_musl() {
            local name="$1" target="$2" out="$3"
            shift 3
            ZIG_LOCAL_CACHE_DIR="/tmp/zig-cache/${name}/local" \
            ZIG_GLOBAL_CACHE_DIR="/tmp/zig-cache/global" \
            zig cc -target "$target" "${COMMON_SIZE_FLAGS[@]}" "$@" \
              "$SOURCE_FILE" -o "release/${out}" \
              -Wl,--gc-sections -pthread -dynamic -s
          }

          build_zig_windows() {
            local name="$1" target="$2" out="$3"
            ZIG_LOCAL_CACHE_DIR="/tmp/zig-cache/${name}/local" \
            ZIG_GLOBAL_CACHE_DIR="/tmp/zig-cache/global" \
            zig cc -target "$target" "${COMMON_SIZE_FLAGS[@]}" \
              -finput-charset=UTF-8 -fexec-charset=UTF-8 \
              "$SOURCE_FILE" -o "release/${out}" \
              -Wl,--gc-sections -lws2_32 -ldnsapi -lwininet -static -s
          }

          build_zig_freebsd() {
            local name="$1" target="$2" sysarch="$3" out="$4"
            local sr="/tmp/freebsd-sysroot/${sysarch}"
            ZIG_LOCAL_CACHE_DIR="/tmp/zig-cache/${name}/local" \
            ZIG_GLOBAL_CACHE_DIR="/tmp/zig-cache/global" \
            zig cc -target "$target" --sysroot "$sr" "${COMMON_SIZE_FLAGS[@]}" \
              -I"${sr}/usr/include" -L"${sr}/usr/lib" -L"${sr}/lib" \
              "$SOURCE_FILE" -o "release/${out}" \
              -Wl,--gc-sections -pthread -s
          }

          build_zig_darwin() {
            local name="$1" target="$2" out="$3"
            ZIG_LOCAL_CACHE_DIR="/tmp/zig-cache/${name}/local" \
            ZIG_GLOBAL_CACHE_DIR="/tmp/zig-cache/global" \
            zig cc -target "$target" "${COMMON_SIZE_FLAGS[@]}" \
              "$SOURCE_FILE" -o "release/${out}" \
              -Wl,-dead_strip -Wl,-s -pthread
          }

          build_android() {
            local target="$1" api="$2" out="$3"
            local ndk_bin
            ndk_bin="$(echo "${ANDROID_NDK_ROOT}"/toolchains/llvm/prebuilt/*/bin)"
            "${ndk_bin}/${target}${api}-clang" \
              "${COMMON_SIZE_FLAGS[@]}" \
              -D__ANDROID__ \
              "$SOURCE_FILE" -o "release/${out}" \
              -Wl,--gc-sections -pthread -s
            "${ndk_bin}/llvm-strip" --strip-all "release/${out}"
          }

          # macOS / Darwin (2, cross-compiled via Zig)
          want all macos darwin darwin-amd64 && launch darwin-amd64 build_zig_darwin darwin-amd64 x86_64-macos  cfnat-darwin-amd64
          want all macos darwin darwin-arm64 && launch darwin-arm64 build_zig_darwin darwin-arm64 aarch64-macos cfnat-darwin-arm64

          # Android (2, NDK r27c)
          want all android android-arm64     && launch android-arm64 build_android aarch64-linux-android 24 cfnat-android-arm64
          want all android android-amd64     && launch android-amd64 build_android x86_64-linux-android  24 cfnat-android-amd64

          # FreeBSD (2)
          want all freebsd freebsd-amd64 && launch freebsd-amd64 build_zig_freebsd freebsd-amd64 x86_64-freebsd  amd64 cfnat-freebsd-amd64
          want all freebsd freebsd-arm64 && launch freebsd-arm64 build_zig_freebsd freebsd-arm64 aarch64-freebsd arm64 cfnat-freebsd-arm64

          # Windows (2)
          want all windows windows-amd64 && launch windows-amd64 build_zig_windows windows-amd64 x86_64-windows-gnu  cfnat-windows-amd64.exe
          want all windows windows-arm64 && launch windows-arm64 build_zig_windows windows-arm64 aarch64-windows-gnu cfnat-windows-arm64.exe

          # Linux 14 架构（同时支持静态版与 -musl 动态版）
          LINUX_SPECS=(
            "linux-amd64|x86_64-linux-musl|"
            "linux-arm64|aarch64-linux-musl|"
            "linux-386|x86-linux-musl|"
            "linux-armv5|arm-linux-musleabi|-mcpu=arm926ej_s -Wno-atomic-alignment -fno-lto"
            "linux-armv6|arm-linux-musleabihf|-mcpu=arm1176jzf_s"
            "linux-armv7|arm-linux-musleabihf|-mcpu=cortex_a7"
            "linux-mips|mips-linux-musleabi|"
            "linux-mipsel|mipsel-linux-musleabi|"
            "linux-mips64|mips64-linux-muslabi64|"
            "linux-mips64el|mips64el-linux-muslabi64|"
            "linux-ppc64|powerpc64-linux-musl|"
            "linux-ppc64le|powerpc64le-linux-musl|"
            "linux-riscv64|riscv64-linux-musl|-fno-lto"
            "linux-s390x|s390x-linux-musl|"
          )

          for spec in "${LINUX_SPECS[@]}"; do
            IFS='|' read -r name target extra <<< "$spec"
            read -r -a extra_arr <<< "$extra"
            if want all linux linux-static "$name"; then
              launch "$name" build_zig_linux_static "$name" "$target" "cfnat-${name}" "${extra_arr[@]}"
            fi
            if want all linux musl linux-musl "${name}-musl"; then
              launch "${name}-musl" build_zig_linux_musl "${name}-musl" "$target" "cfnat-${name}-musl" "${extra_arr[@]}"
            fi
          done

          if [ "${#pids[@]}" -eq 0 ]; then
            echo "ℹ️ No Ubuntu pool targets matched; skipping build."
            exit 0
          fi

          failed=0
          for i in "${!pids[@]}"; do
            name="${names[$i]}"
            if wait "${pids[$i]}"; then
              echo "✅ [${name}] build succeeded"
            else
              echo "❌ [${name}] build failed"
              cat "/tmp/build-logs/${name}.log"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ]

          # 32 位 MIPS 静态版 UPX 压缩（UPX 官方暂不支持 mips64/mips64el ELF）
          for bin in cfnat-linux-mips cfnat-linux-mipsel; do
            if [ -f "release/${bin}" ]; then
              upx --best --lzma -o "release/${bin}-upx" "release/${bin}"
              echo "✅ [${bin}-upx] UPX compressed"
            fi
          done

          # 32 位 MIPS musl 动态版尝试 UPX 压缩（若不支持或体积无法再压缩则自动跳过）
          for bin in cfnat-linux-mips-musl cfnat-linux-mipsel-musl; do
            if [ -f "release/${bin}" ]; then
              if upx --best --lzma -o "release/${bin}-upx" "release/${bin}"; then
                echo "✅ [${bin}-upx] UPX compressed"
              else
                rm -f "release/${bin}-upx"
                echo "⚠️ [${bin}-upx] skipped (not compressible or unsupported by UPX)"
              fi
            fi
          done

          ls -lh release/

      - name: Upload All Platform binaries to Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag_name }}
          PRERELEASE: ${{ inputs.prerelease || false }}
          EDITION: ${{ github.event_name == 'workflow_dispatch' && inputs.edition || 'cfd' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release/cfnat-*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "ℹ️ No binaries to upload."
            exit 0
          fi

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            if [ "${EDITION:-cfd}" = "pure" ]; then
              ver=$(grep -E '^#define[[:space:]]+CFNAT_VERSION[[:space:]]+"' "$SOURCE_FILE" | tail -n1 | sed -E 's/.*"([^"]+)".*/\1/')
            else
              ver=$(grep -E '^#define[[:space:]]+CFNAT_VERSION[[:space:]]+"' "$SOURCE_FILE" | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
            fi
            tag="${ver:+v${ver}}"
            tag="${tag:-continuous}"
          fi

          echo "Publishing to release tag: $tag"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            extra_args=()
            if [ "$PRERELEASE" = "true" ]; then
              extra_args+=(--prerelease)
            else
              extra_args+=(--latest)
            fi
            gh release create "$tag" --title "Release $tag" --generate-notes "${extra_args[@]}" \
              || gh release view "$tag" >/dev/null 2>&1
          fi
          gh release upload "$tag" "${files[@]}" --clobber

      - name: Upload test artifacts (when publish_release is false)
        if: github.event_name == 'workflow_dispatch' && !inputs.publish_release
        uses: actions/upload-artifact@v4
        with:
          name: binaries-all
          path: release/cfnat-*
          if-no-files-found: ignore
          retention-days: 3
